<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dubai Districts</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/latest/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/latest/maptiler-sdk.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: system-ui, sans-serif; background: #0f1117; }

    #map { width: 100vw; height: 100vh; }

#title {
      position: absolute;
      bottom: 32px;
      left: 24px;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    #title span {
      display: block;
      font-size: 12px;
      font-weight: 400;
      opacity: 0.55;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="title"><span>Map</span>Dubai Districts</div>

  <script type="module">
    maptilersdk.config.apiKey = 'Jx70Vaf33XzsEXE4oOno';

    const styleRes = await fetch('https://api.maptiler.com/maps/dataviz-v4/style.json?key=Jx70Vaf33XzsEXE4oOno');
    const style = await styleRes.json();
    style.layers = style.layers.filter(l => l.type !== 'symbol');

    const map = new maptilersdk.Map({
      container: 'map',
      style,
      center: [55.2708, 25.2048],
      zoom: 10,
    });

    map.on('load', async () => {
      map.addSource('hillshade', {
        type: 'raster',
        tiles: ['https://api.maptiler.com/tiles/hillshade/{z}/{x}/{y}.webp?key=Jx70Vaf33XzsEXE4oOno'],
        tileSize: 512,
        attribution: '© MapTiler',
      });
      map.addLayer({ id: 'hillshade', type: 'raster', source: 'hillshade', paint: { 'raster-opacity': 0.6 } });

      const geojson = await fetch('data.json').then(r => r.json());

      map.addSource('districts', { type: 'geojson', data: geojson });

      map.addLayer({
        id: 'districts-fill',
        type: 'fill',
        source: 'districts',
        paint: {
          'fill-color': ['coalesce', ['get', 'color'], '#888888'],
          'fill-opacity': 0.55,
        },
      });

      map.addLayer({
        id: 'districts-outline',
        type: 'line',
        source: 'districts',
        paint: {
          'line-color': '#aaaaaa',
          'line-width': 1,
          'line-opacity': 1,
        },
      });

      // Label points from the stored coordinates
      const labelFeatures = geojson.features
        .filter(f => f.properties.label_lng != null)
        .map(f => ({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [f.properties.label_lng, f.properties.label_lat] },
          properties: { name: f.properties.name },
        }));

      map.addSource('labels', { type: 'geojson', data: { type: 'FeatureCollection', features: labelFeatures } });

      map.addLayer({
        id: 'district-labels',
        type: 'symbol',
        source: 'labels',
        layout: {
          'text-field': ['get', 'name'],
          'text-size': 11,
          'text-font': ['Open Sans Regular'],
          'text-max-width': 8,
          'text-anchor': 'center',
        },
        paint: {
          'text-color': '#1a1a1a',
          'text-halo-color': '#ffffff',
          'text-halo-width': 1.5,
        },
      });

      // Fit map to data bounds
      const coords = geojson.features.flatMap(f => {
        const geom = f.geometry;
        if (!geom) return [];
        return geom.coordinates.flat(1);
      });
      if (coords.length) {
        const lons = coords.map(c => c[0]);
        const lats = coords.map(c => c[1]);
        map.fitBounds(
          [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
          { padding: 32, duration: 1000 }
        );
      }
    });
  </script>
</body>
</html>
